
# Server
server.port=8080
server.servlet.context-path=/api


spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}

# H2 Console (for development inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


app.jwt.secret=${SECRET}
app.jwt.expiration-ms=86400000


# Application Settings

app.pagination.default-page-size=10
app.pagination.max-page-size=100


# Logging
logging.level.com.finance.dashboard=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN


# OpenAPI / Swagger UI

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
