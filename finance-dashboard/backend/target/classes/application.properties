# =============================================
# Finance Dashboard - Application Configuration
# =============================================

# Server
server.port=8080
server.servlet.context-path=/api

# =============================================
# Database - H2 Embedded (SQL)
# Swap datasource URL/driver for PostgreSQL or MySQL in production
# =============================================
spring.datasource.url=jdbc:h2:file:./data/financedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=finance123

# H2 Console (for development inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=FinanceDashboard_SuperSecret_JWT_Key_2024_$ecure!_MustBe256BitsLong
app.jwt.expiration-ms=86400000

# =============================================
# Application Settings
# =============================================
app.pagination.default-page-size=10
app.pagination.max-page-size=100

# =============================================
# Logging
# =============================================
logging.level.com.finance.dashboard=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# OpenAPI / Swagger UI
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
